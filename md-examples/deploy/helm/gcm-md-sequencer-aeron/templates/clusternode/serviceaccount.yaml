{{- if .Values.clusterNode.enabled }}
# No Role/RoleBinding: cluster-node never touches the Kubernetes API (Raft replaces the
# Kubernetes Lease phase-1 used — design §3.3 bans a Kubernetes client dependency here
# entirely). This ServiceAccount exists only as a stable identity to attach a Role to later
# if that ever changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gcm-md.clusterNode.name" . }}
  labels:
    {{- include "gcm-md.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-node
{{- end }}
