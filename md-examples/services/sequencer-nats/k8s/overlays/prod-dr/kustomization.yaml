apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: md-sequencer-dr

resources:
  - ../../base/core
  - ../../base/pdb
  - ../../base/observability

images:
  # Replace <PROD_ACCOUNT_ID> with the real AWS account ID hosting the prod ECR repo (same
  # account as prod, different region — ECR repos are regional, so this is a us-west-2 replica).
  - name: gcm-md-sequencer
    newName: <PROD_ACCOUNT_ID>.dkr.ecr.us-west-2.amazonaws.com/gcm-md-sequencer
    newTag: prod-latest

configMapGenerator:
  - name: gcm-md-sequencer-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod-dr

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: gcm-md-sequencer
