apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: md-sequencer-uat

resources:
  - ../../base/core
  - ../../base/pdb
  - ../../base/observability

images:
  # Replace <NONPROD_ACCOUNT_ID> with the real AWS account ID hosting the dev/uat ECR repo.
  - name: gcm-md-sequencer
    newName: <NONPROD_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/gcm-md-sequencer
    newTag: uat-latest

configMapGenerator:
  - name: gcm-md-sequencer-config
    literals:
      - SPRING_PROFILES_ACTIVE=uat

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: gcm-md-sequencer
