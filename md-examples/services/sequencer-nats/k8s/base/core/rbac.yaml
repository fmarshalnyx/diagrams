apiVersion: v1
kind: ServiceAccount
metadata:
  name: gcm-md-sequencer
---
# Grants only what Lease-based leader election needs (spec §10) — read/write/create on the
# specific Lease object the sequencer.leadership.lease-name config points at, in whichever
# namespace this overlay deploys into.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcm-md-sequencer-lease
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcm-md-sequencer-lease
subjects:
  - kind: ServiceAccount
    name: gcm-md-sequencer
roleRef:
  kind: Role
  name: gcm-md-sequencer-lease
  apiGroup: rbac.authorization.k8s.io
